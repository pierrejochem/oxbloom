[package]
name = "oxbloom-test"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
web = [
    "oxbloom-boot/web",
    "dep:oxbloom-web",
    "dep:bytes",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "tokio/net",
    "tokio/sync",
]
json = ["web", "oxbloom-web/json", "dep:serde", "dep:serde_json"]
# HTTPS for `TestClient::connect_tls` and `RunningApp::client_tls`; `oxbloom-boot/ssl` lets a
# `TestApp` serve `server.ssl.bundle`.
tls = ["web", "oxbloom-boot/ssl", "dep:rustls", "dep:tokio-rustls"]
security = ["oxbloom-boot/security", "dep:oxbloom-security"]
logging = ["oxbloom-boot/logging"]
# `MockHttpClient` and `MockResponse`; `oxbloom-boot/http-client` lets `ContextRunner` and `TestApp::full`
# run `HttpClientAutoConfiguration`.
http-client = ["oxbloom-boot/http-client", "dep:oxbloom-http-client", "dep:async-trait", "dep:http", "dep:serde", "dep:serde_json"]
# `FakeProvider`: an OpenID Connect provider over `MockHttpClient` that signs id tokens with an
# ES256 key generated at construction (`aws-lc-rs`, no `ring`).
oauth2 = ["http-client", "dep:jsonwebtoken", "dep:aws-lc-rs", "dep:base64"]
# `TestDatabase` over SQLite, `MigrationFiles` and `TestDatabase::with_migrations`; `oxbloom-boot/data-sqlite` lets `ContextRunner` run
# `DataAutoConfiguration` on the `config_snippet`.
data = ["dep:oxbloom-data", "oxbloom-data/sqlite", "oxbloom-data/migrate", "oxbloom-boot/data-sqlite"]
# `TestDatabase::postgres` and `TestDatabase::mysql`; `url` rewrites the database of the server URL.
data-postgres = ["data", "oxbloom-data/postgres", "oxbloom-boot/data-postgres", "dep:url"]
data-mysql = ["data", "oxbloom-data/mysql", "oxbloom-boot/data-mysql", "dep:url"]

[dependencies]
# The ES256 key pair of `FakeProvider` (feature `oauth2`); `aws-lc-sys` only, no `ring`.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"], optional = true }
async-trait = { version = "0.1.92", optional = true }
base64 = { version = "0.23.1", optional = true }
bytes = { version = "1.12.1", optional = true }
http = { version = "1.5.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
# Signs the id tokens of `FakeProvider` (feature `oauth2`).
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"], optional = true }
oxbloom-boot = { version = "0.1.0", path = "../oxbloom-boot" }
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
oxbloom-data = { version = "0.1.0", path = "../oxbloom-data", optional = true }
oxbloom-di = { version = "0.1.0", path = "../oxbloom-di" }
oxbloom-http-client = { version = "0.1.0", path = "../oxbloom-http-client", default-features = false, features = ["json"], optional = true }
oxbloom-security = { version = "0.1.0", path = "../oxbloom-security", optional = true }
# `default-features = false` has no effect while boot's `web` feature, which `web` forwards,
# turns the defaults of `oxbloom-web` on.
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web", default-features = false, optional = true }
# `aws-lc-rs` is the only crypto provider: no `ring`.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }
# Replaces the database in the server URLs of `TestDatabase` (features `data-postgres`, `data-mysql`).
url = { version = "2.5.8", optional = true }

[dev-dependencies]
bytes = "1.12.1"
# The data conformance suites (`tests/data_conformance*.rs`, `tests/data_migrate_conformance*.rs`):
# the `DataHealthIndicator`, the actuator health endpoint of a `TestApp`, the retry policy of
# `transaction_with_retry`, and the migrations that the `DataService` runs at startup
# (`data-migrate`, which builds nothing without a driver feature).
oxbloom-actuator = { version = "0.1.0", path = "../oxbloom-actuator", features = ["data"] }
oxbloom-boot = { version = "0.1.0", path = "../oxbloom-boot", features = ["actuator", "data-migrate"] }
oxbloom-tasks = { version = "0.1.0", path = "../oxbloom-tasks" }
http = "1.5.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
oxbloom-security = { version = "0.1.0", path = "../oxbloom-security" }
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web" }
# Test certificates for `tests/https.rs` are generated at test time; `aws-lc-rs` only, no `ring`.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The migration conformance suites capture the `tracing` events of a run to prove that no SQL
# reaches them.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
