[package]
name = "oxbloom-test"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
web = [
    "oxbloom-boot/web",
    "dep:oxbloom-web",
    "dep:bytes",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "tokio/net",
    "tokio/sync",
]
json = ["web", "oxbloom-web/json", "dep:serde", "dep:serde_json"]
# HTTPS for `TestClient::connect_tls` and `RunningApp::client_tls`; `oxbloom-boot/ssl` lets a
# `TestApp` serve `server.ssl.bundle`.
tls = ["web", "oxbloom-boot/ssl", "dep:rustls", "dep:tokio-rustls"]
security = ["oxbloom-boot/security"]
logging = ["oxbloom-boot/logging"]

[dependencies]
bytes = { version = "1.12.1", optional = true }
http = { version = "1.5.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
oxbloom-boot = { version = "0.1.0", path = "../oxbloom-boot" }
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
oxbloom-di = { version = "0.1.0", path = "../oxbloom-di" }
# `default-features = false` has no effect while boot's `web` feature, which `web` forwards,
# turns the defaults of `oxbloom-web` on.
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web", default-features = false, optional = true }
# `aws-lc-rs` is the only crypto provider: no `ring`.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }

[dev-dependencies]
bytes = "1.12.1"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
oxbloom-security = { version = "0.1.0", path = "../oxbloom-security" }
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web" }
# Test certificates for `tests/https.rs` are generated at test time; `aws-lc-rs` only, no `ring`.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
