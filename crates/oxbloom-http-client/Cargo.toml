[package]
name = "oxbloom-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["json", "reqwest"]
json = []
# `ReqwestClient` and `ClientBuilder` over `reqwest` with rustls (aws-lc-rs, never ring).
reqwest = ["dep:reqwest", "dep:rustls", "dep:form_urlencoded"]
# `RetryingClient` over the retry policy of `oxbloom-tasks`; off by default, so a build
# without it does not depend on `oxbloom-tasks`.
retry = ["dep:oxbloom-tasks"]
# `HttpClientSettings`: the `http.client` keys of `oxbloom-config`, building a `ReqwestClient` with
# an optional `RetryingClient`.
config = ["reqwest", "retry", "dep:oxbloom-config", "serde/derive"]

[dependencies]
async-trait = "0.1.92"
# Encodes `Body::Form` for `ReqwestClient`.
form_urlencoded = { version = "1.2.2", optional = true }
http = "1.5.0"
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config", optional = true }
oxbloom-tasks = { version = "0.1.0", path = "../oxbloom-tasks", optional = true }
# The `rustls` feature selects rustls with aws-lc-rs and the platform certificate verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
# Only to name `rustls::ClientConfig` in `ClientBuilder::tls`; the client configuration a
# caller passes carries its own crypto provider (aws-lc-rs, never ring).
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
# A local HTTPS server for `tests/reqwest_client.rs`, with a private CA generated at test
# time; `aws-lc-rs` only, no `ring`.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false }
