[package]
name = "oxbloom-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["json"]
json = []

[dependencies]
async-trait = "0.1.92"
http = "1.5.0"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
