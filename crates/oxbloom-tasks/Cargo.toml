[package]
name = "oxbloom-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
cron = "0.17.0"
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
oxbloom-macros = { version = "0.1.0", path = "../oxbloom-macros" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
trybuild = "1.0.122"
