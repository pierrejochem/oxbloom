[package]
name = "oxbloom-actuator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The features gate optional parts that later tasks add; the health and availability types
# are always available.
[features]
web = ["dep:oxbloom-web", "dep:http"]
logging = ["web", "dep:oxbloom-logging"]
ssl = ["dep:oxbloom-ssl", "dep:oxbloom-core"]
di = []

[dependencies]
async-trait = "0.1.92"
http = { version = "1.5.0", optional = true }
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core", optional = true }
oxbloom-logging = { version = "0.1.0", path = "../oxbloom-logging", optional = true }
oxbloom-ssl = { version = "0.1.0", path = "../oxbloom-ssl", optional = true }
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
tracing = "0.1.44"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }

[[test]]
name = "controller"
required-features = ["web"]

[[test]]
name = "loggers"
required-features = ["logging"]

[[test]]
name = "ssl_indicator"
required-features = ["ssl"]
