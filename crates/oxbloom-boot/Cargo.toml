[package]
name = "oxbloom-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
web = ["dep:oxbloom-web", "dep:serde", "dep:tracing", "tokio/net"]
security = ["dep:oxbloom-security", "oxbloom-security/di"]
logging = ["dep:oxbloom-logging", "dep:tracing", "oxbloom-actuator?/logging"]
# With `security` as well, `security.jwt.jwks-ssl-bundle` builds the JWKS fetcher from a bundle,
# which needs `oxbloom-security/jwks` (`ReqwestJwksFetcher::with_tls`).
ssl = ["web", "dep:oxbloom-ssl", "oxbloom-ssl/di", "oxbloom-web/tls", "dep:tokio-rustls", "oxbloom-security?/jwks", "oxbloom-actuator?/ssl"]
# `ActuatorAutoConfiguration`: the health, info and (with `logging`) loggers endpoints.
actuator = ["web", "dep:oxbloom-actuator", "oxbloom-actuator/web"]

[dependencies]
oxbloom-actuator = { version = "0.1.0", path = "../oxbloom-actuator", optional = true }
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config", features = ["di"] }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
oxbloom-di = { version = "0.1.0", path = "../oxbloom-di" }
oxbloom-logging = { version = "0.1.0", path = "../oxbloom-logging", optional = true }
oxbloom-macros = { version = "0.1.0", path = "../oxbloom-macros" }
oxbloom-security = { version = "0.1.0", path = "../oxbloom-security", optional = true }
oxbloom-ssl = { version = "0.1.0", path = "../oxbloom-ssl", optional = true }
# Default features on purpose: they include the `gzip`, `brotli` and `zstd` codecs that
# `server.compression.enabled` needs. Boot forwards no codec features of its own.
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
tracing = { version = "0.1.44", optional = true }
# The server-side TLS acceptor of `server.ssl.bundle`; the bundle's `ServerConfig` picks the
# crypto provider (`aws-lc-rs`), so no provider feature here.
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "signal"] }

[dev-dependencies]
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
# These features turn boot's `web`, `security` and `ssl` (through `tls`) on for every
# `cargo test -p oxbloom-boot` build, so no boot test run builds `web` without `security` or
# without `ssl`. Feature-off coverage is the compile-only `cargo build -p oxbloom-boot
# --no-default-features` (also with `--features logging`, `web`, `security` or `ssl`) and
# `cargo test -p oxbloom-test --features web`, which runs `TestApp` against boot built with
# `web` and without `security` or `ssl`.
oxbloom-test = { path = "../oxbloom-test", features = ["web", "security", "tls"] }
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web" }
# Test certificates for `tests/autoconfigure_ssl.rs` are generated at test time; `aws-lc-rs`
# only, no `ring`. HTTPS requests go through `RunningApp::client_tls`; a handshake-only rustls
# client there reads which certificate the server presents.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false }
trybuild = "1.0.122"
