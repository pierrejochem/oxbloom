[package]
name = "oxbloom-security"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
di = ["dep:oxbloom-di"]
jwks = ["dep:reqwest"]

[dependencies]
async-trait = "0.1.92"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-core = { version = "0.1.0", path = "../oxbloom-core" }
oxbloom-di = { version = "0.1.0", path = "../oxbloom-di", optional = true }
oxbloom-web = { version = "0.1.0", path = "../oxbloom-web" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "test-util", "net", "io-util", "sync"] }
