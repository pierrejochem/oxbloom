[package]
name = "oxbloom-data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# None of the features is on by default; at least one driver is needed to build any pool.
default = []
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs-native-roots"]
mysql = ["sqlx/mysql", "sqlx/tls-rustls-aws-lc-rs-native-roots"]
sqlite = ["sqlx/sqlite", "sqlx/tls-rustls-aws-lc-rs-native-roots"]
# `transaction_with_retry`: runs the work of a transaction again after a serialization
# failure or a deadlock, with the retry policy of `oxbloom-tasks`. The feature only adds that
# function (it is additive). Off by default, so a build without it does not depend on
# `oxbloom-tasks`; `fastrand` draws the jitter of the delays.
retry = ["dep:oxbloom-tasks", "dep:fastrand"]
# The migration runner (`oxbloom_data::migrate`): enables the `migrate` feature of `sqlx`. The feature
# is additive and off by default, so a build without it does not compile the migration code.
migrate = ["sqlx/migrate"]

[dependencies]
# The `data.*` keys: the lenient `Config` reading and `Secret` for the URL. Durations are read by
# `oxbloom-config` itself, so there is no dependency on `oxbloom-tasks`.
oxbloom-config = { version = "0.1.0", path = "../oxbloom-config" }
oxbloom-tasks = { version = "0.1.0", path = "../oxbloom-tasks", optional = true }
fastrand = { version = "2.3.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# Each driver feature also enables rustls with aws-lc-rs and the platform root certificates
# (never ring), so a build without drivers has no TLS crates. The `migrate` feature of this crate
# enables the `migrate` feature of sqlx; the `macros` feature of sqlx (for `sqlx::migrate!`) is
# left to the application.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio"] }
# Already in the tree through sqlx: the runtime check before a pool is built and the timeout of
# `DataSources::ping`.
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
# The migration tests write their files and databases into temporary directories.
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
# The log hygiene test captures the `tracing` events of a run and a revert, the same way the
# tests of `oxbloom-security` capture theirs.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
