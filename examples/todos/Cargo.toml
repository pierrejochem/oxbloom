[package]
name = "todos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
http = "1.5.0"
oxbloom-boot = { version = "0.1.0", path = "../../crates/oxbloom-boot", features = ["web", "security", "logging"] }
oxbloom-di = { version = "0.1.0", path = "../../crates/oxbloom-di" }
oxbloom-security = { version = "0.1.0", path = "../../crates/oxbloom-security", features = ["di"] }
oxbloom-web = { version = "0.1.0", path = "../../crates/oxbloom-web" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
oxbloom-test = { path = "../../crates/oxbloom-test", features = ["web"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
