[package]
name = "todos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
http = "1.5.0"
oxbloom-boot = { version = "0.1.0", path = "../../crates/oxbloom-boot", features = ["web", "security", "logging", "actuator", "tasks"] }
oxbloom-actuator = { version = "0.1.0", path = "../../crates/oxbloom-actuator" }
oxbloom-config = { version = "0.1.0", path = "../../crates/oxbloom-config" }
oxbloom-di = { version = "0.1.0", path = "../../crates/oxbloom-di" }
oxbloom-security = { version = "0.1.0", path = "../../crates/oxbloom-security", features = ["di"] }
oxbloom-tasks = { version = "0.1.0", path = "../../crates/oxbloom-tasks" }
oxbloom-web = { version = "0.1.0", path = "../../crates/oxbloom-web" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[build-dependencies]
oxbloom-actuator = { version = "0.1.0", path = "../../crates/oxbloom-actuator" }

[dev-dependencies]
oxbloom-core = { version = "0.1.0", path = "../../crates/oxbloom-core" }
oxbloom-test = { path = "../../crates/oxbloom-test", features = ["web", "security"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
