# The configuration of the todos example. `cargo run -p todos` reads it from
# this directory.

[server]
port = 8081

# The cleanup task removes done todos that have been done for longer than this. It runs
# one minute after each run ended, and first when the application starts. Durations: 500ms, 30s, 15m, 24h.
[todos.cleanup]
max-age = "24h"

# The store access of the cleanup is retried when it fails. These are the defaults of every
# `#[retryable]` method; the attribute on `purge_at` fixes `max_attempts = 3` and
# `initial = "50ms"` for the cleanup call. Uncomment to change the defaults.
# [tasks.retry]
# max-attempts = 3
# backoff = "exponential"        # exponential or fixed
# initial = "100ms"
# multiplier = 2.0
# max-delay = "30s"
# jitter = "full"                # none, full or equal

# Console logging at `info`. The example's own events (target `todos`: create,
# update, delete) are `info` events, and the target `todos` is set to `debug`, so
# they are shown along with any `debug` events. On the command line,
# `--logging.level.todos=warn` hides them, and `--oxbloom.logging.enabled=false`
# switches logging off.
[logging.level]
root = "info"
todos = "debug"

# More logging options, all off by default. Uncomment to try them.
#
# A rotating log file in addition to the console. Use a dedicated directory and a
# distinctive file name prefix, because `max-history` deletes every file in the
# directory whose name starts with the prefix. The file writer drops events when
# its buffer is full.
# [logging.file]
# enabled = true
# path = "logs/todos"
# name = "todos"
# rotation = "daily"       # hourly, daily or never
# max-history = 7
# format = "json"          # full, compact or json
#
# JSON lines on the console, without the thread and with shorter names.
# [logging.console]
# format = "json"
# [logging.json.fields]
# thread = false
# [logging.json.names]
# timestamp = "ts"
# message = "msg"
#
# One event per HTTP request at the target `oxbloom::web::request`. The query
# string is never logged, and credential headers (authorization, cookie, x-api-key
# and the like) print as <redacted> even when listed. The request log runs first
# and also records the 401, 403, 404, 405, 413 and 500 answers. A level
# below the root level needs `"oxbloom::web::request" = "debug"` in
# [logging.level].
# [logging.request]
# enabled = true
# level = "info"
# headers = ["user-agent", "x-request-id"]

# Web server options, all unset here so the defaults apply. Uncomment to try them.
# Errors (404, 405, 413, 401, 403, 500 and the 404/422 of this example) are
# `application/problem+json`. The request log, error rendering, body limit and
# security run in a fixed order, so the request log records 401, 403 and 413 too.
# [server]
# shutdown-timeout = "30s"       # wait this long for open connections, then drop them
# max-body-bytes = "1MiB"        # larger request bodies get 413
# header-read-timeout = "10s"    # above 0 and at most 1 day
#
# [server.error]
# include-message = "never"      # "always" shows a panic message as `detail`
#
# Forwarded headers are ignored unless the strategy is `framework`. Enable it only
# behind a proxy that overwrites Forwarded and X-Forwarded-* (see the README).
# [server.forward-headers]
# strategy = "none"              # none or framework
# trusted-proxies = ["127.0.0.1", "10.0.0.0/8"]   # default: loopback only

# CORS, compression and static files, all off by default. Uncomment to try them.
# CORS is off until `allowed-origins` is set. List origins as the browser sends them
# (scheme, host and a non-default port, no trailing slash); `*` must be the only
# entry of its list and cannot be combined with `allow-credentials`. Methods are
# case-sensitive, so write them in upper case. A preflight from an allowed origin
# is answered before the security chain runs.
# [server.cors]
# allowed-origins = ["http://localhost:3000"]
# allowed-methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]
# allowed-headers = ["Content-Type"]
# exposed-headers = ["Location"]
# allow-credentials = false
# max-age = "30m"
#
# Compression with gzip, brotli or zstd, as the client's Accept-Encoding allows. Do
# not compress responses that mix secrets with input an attacker controls (BREACH).
# [server.compression]
# enabled = true
# min-size = "1KiB"
# mime-types = ["application/json", "application/problem+json", "text/*"]
# level = "default"              # fast, default or best
# max-body-bytes = "8MiB"
#
# Static files from a directory that must exist. Paths must be in canonical form
# (no `//`, no dotfiles, no escapes of ordinary characters), and a name that starts
# with `.` is never served. The example's security rules open `/api/todos/**` only,
# so serve files below a prefix that your rules allow.
# [server.static]
# enabled = true
# directory = "static"
# path = "/assets"
# index = "index.html"
# cache-max-age = "1h"           # 0s sends `no-cache`
# max-file-bytes = "10MiB"

# HTTP Basic for the admin route `GET /api/admin/stats`. The users are demo values only:
# `admin` has the password `changeit` and `viewer` has `viewonly`. The passwords are
# `{argon2}` hashes; plain text is refused at start. Change them before any real use.
[security.http-basic]
enabled = true

[security.users.admin]
password = "{argon2}$argon2id$v=19$m=19456,t=2,p=1$o7wig9MmUHtebFWjVdledQ$cNFCpU97oR+uVTwaudTL1Oe02bQDz9rJYpKVceZoGDo"
roles = ["ADMIN"]

[security.users.viewer]
password = "{argon2}$argon2id$v=19$m=19456,t=2,p=1$fBLpZKqG5tOuCf+Krks/zQ$hkOLCeXrKiVoR1MxwIGtt0fD7SeIGfKImKLjKYhe+rw"
roles = ["USER"]

# Sessions for `GET /api/visits`, which counts the requests of one browser in a session. The
# section turns the session filter on. `store = "memory"` keeps the sessions in this process
# (they are lost at a restart and not shared between instances). The other keys have their
# defaults: the cookie `OXBLOOM_SESSION` is HttpOnly and `SameSite=Lax`, `Secure` follows the
# request scheme, and a session ends after 30 minutes unused or 8 hours in total.
#
# Session management: a user may hold at most two sessions. At a form login the session that was
# touched longest ago is ended when the user would otherwise have three. `POST /me/logout-everywhere`
# ends the other sessions of the logged-in user through the `SessionRegistry` bean. The user is
# also checked again against the user service every `revalidate-interval` (default `5m`, `0` is
# off). The limit needs the in-memory store and does not hold exactly under logins that race.
# Response headers (`X-Content-Type-Options`, `Referrer-Policy`, `X-Frame-Options`, `Cache-Control`
# on authenticated answers) are on by default and are set under `security.headers`.
[security.session]
store = "memory"
max-sessions-per-user = 2

# Form login for browsers. `GET /me` is an HTML page behind the login: a browser without a
# session is redirected to `/login`, which Oxbloom serves as a default page, and comes back to
# `/me` after the login. The users are the demo users above (`admin` / `changeit`). It needs the
# `security.session` section and a password provider. All other keys have their defaults:
# `login-page`, `login-processing-url` and `logout-url` are `/login`, `/login` and `/logout`.
# CSRF protection follows form login and is on by default. The login page and the `/me` forms
# carry the token of the session in the hidden field `_csrf`, and every state-changing request
# that the session authenticates (also `POST /api/todos` with the cookie) must send it in that
# field or in the header `X-CSRF-TOKEN`, otherwise the answer is 403. The two POSTs of the login
# flow also pass a same-origin check, and the cookie is `SameSite=Lax`. Uncomment to change the
# names or to add an endpoint that returns the token as JSON for scripts.
[security.form-login]
enabled = true

# [security.csrf]
# enabled = true                 # false turns the check off; it needs form login
# field-name = "_csrf"           # `GET /me` writes the hidden field with this name
# header-name = "X-CSRF-TOKEN"
# token-endpoint = "/csrf"       # GET answers {"headerName":..,"parameterName":..,"token":..}

# Remember-me: a login with the "Remember me" checkbox also gets the cookie `OXBLOOM_REMEMBER_ME`
# (HttpOnly, `SameSite=Lax`, valid for `lifetime`, 14 days by default and fixed from the login).
# A browser that has lost its session cookie is then logged in again, as a user who is
# "remembered" and not "fully authenticated". The cookie is signed with this secret and bound to
# the password of the user, so a password change ends every cookie of that user at once. THE
# SECRET BELOW IS A DEVELOPMENT VALUE FOR THIS EXAMPLE ONLY: it is public, so anyone could forge a
# cookie. Replace it with a random value of at least 32 bytes from your secret store, and never
# pass it on the command line (Oxbloom refuses that). To rotate it, put the new secret in
# `secret` and move the old one to `old-secrets`. The cookie holds the user name in the clear
# (base64url, not encrypted), and there is no per-device revocation (see the guide).
[security.remember-me]
enabled = true
secret = "development-only-remember-me-secret-change-me-0123456789"
# old-secrets = ["the-previous-secret-of-at-least-32-bytes"]
# lifetime = "14d"               # 1 minute to 365 days
# field-name = "remember-me"     # the login form field of the checkbox
# cookie-name = "OXBLOOM_REMEMBER_ME"
