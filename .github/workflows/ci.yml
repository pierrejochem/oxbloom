name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: oxbloom-web without default features
        run: cargo test -p oxbloom-web --no-default-features
      - name: oxbloom-web with the tls feature
        run: cargo test -p oxbloom-web --features tls
      - name: oxbloom-ssl with all features
        run: cargo test -p oxbloom-ssl --all-features
      - name: oxbloom-actuator with all features
        run: cargo test -p oxbloom-actuator --all-features
      - name: oxbloom-boot builds with each feature set
        run: |
          cargo build -p oxbloom-boot --no-default-features
          cargo build -p oxbloom-boot --no-default-features --features logging
          cargo build -p oxbloom-boot --no-default-features --features web
          cargo build -p oxbloom-boot --no-default-features --features security
          cargo build -p oxbloom-boot --no-default-features --features ssl
          cargo build -p oxbloom-boot --no-default-features --features actuator
          cargo build -p oxbloom-boot --no-default-features --features actuator,logging
          cargo build -p oxbloom-boot --no-default-features --features actuator,ssl
          cargo build -p oxbloom-boot --no-default-features --features actuator,security
      - name: oxbloom-test with the web feature
        run: cargo test -p oxbloom-test --features web
      - name: oxbloom-test with the web and tls features
        run: cargo test -p oxbloom-test --features web,tls

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make check-examples

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
